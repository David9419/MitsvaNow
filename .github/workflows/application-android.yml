# Fabrique l'application Android de test (fichier .apk) à chaque changement
# dans le dossier « application/ », ou à la demande (onglet « Actions » de GitHub).
# Le fichier se télécharge en bas de la page du « run », section « Artifacts ».
name: Application Android (test)

on:
  push:
    paths:
      - "application/**"
      - ".github/workflows/application-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les outils
        run: npm ci
      - name: Préparer le projet Android
        run: npx cap sync android
      - name: Fabriquer l'APK de test
        working-directory: application/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: mivtsa-now-android-test
          path: application/android/app/build/outputs/apk/debug/app-debug.apk
